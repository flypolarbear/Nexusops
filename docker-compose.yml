services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexusops-postgres
    environment:
      POSTGRES_USER: nexusops
      POSTGRES_PASSWORD: nexusops
      POSTGRES_DB: nexusops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusops-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusops-network

  # OpenClaw Gateway - AI Agent Gateway
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: nexusops-openclaw
    ports:
      - "18789:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
      - ./openclaw/workspace:/home/node/.openclaw/nexusops/workspace:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENCLAW_CONFIG_CONTENT=${OPENCLAW_CONFIG_CONTENT}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18789/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexusops-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusops-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexusops:nexusops@postgres:5432/nexusops
      - REDIS_URL=redis://redis:6379
      - OPENCLAW_GATEWAY_URL=http://openclaw:18789
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusops-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nexusops-network

volumes:
  postgres_data:
  redis_data:
  openclaw_data:

networks:
  nexusops-network:
    driver: bridge
