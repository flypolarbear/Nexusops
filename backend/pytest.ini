[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=app --cov-report=term-missing
markers =
    unit: Unit tests - fast, isolated tests with no external dependencies
    integration: Integration tests - tests with database or external services
    e2e: End-to-end tests - full workflow tests
    slow: Slow running tests - tests that take significant time
    agent: Agent-related tests - tests for agent functionality
    api: API endpoint tests - tests for REST API endpoints
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
