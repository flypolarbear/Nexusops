[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusops-sdk"
version = "1.0.0"
description = "Python SDK for NexusOps Agent API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NexusOps Team", email = "team@nexusops.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["nexusops", "agent", "sdk", "api", "devops"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/nexusops/nexusops"
Documentation = "https://docs.nexusops.dev"
Repository = "https://github.com/nexusops/nexusops"
Issues = "https://github.com/nexusops/nexusops/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]
