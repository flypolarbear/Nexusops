services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexusops-postgres
    environment:
      POSTGRES_USER: nexusops
      POSTGRES_PASSWORD: nexusops
      POSTGRES_DB: nexusops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusops-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusops-network

volumes:
  postgres_data:
  redis_data:

networks:
  nexusops-network:
    driver: bridge
